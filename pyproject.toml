[project]
name = "whisperit"
version = "0.1.0"
description = "Audio and video transcription using faster-whisper"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "faster-whisper>=1.1,<2",
    "huggingface-hub>=0.23,<3",
    "PyQt6>=6.7,<7",
    "pydub>=0.25,<1",
    "python-dotenv>=1,<2",
    "tqdm>=4.66,<5",
]

[project.scripts]
whisperit = "src.cli:main"
whisperit-gui = "src.gui:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.10,<7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
